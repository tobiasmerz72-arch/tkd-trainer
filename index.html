<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tobi's TKD Academy">
  <title>Tobi's Taekwon-Do Academy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="intro-static.css">
</head>
<body>
  <section id="launchScreen" class="launch-screen static-intro" aria-label="Welcome screen">
    <div class="intro-copy">
      <div class="intro-title">Tobi's</div>
      <div class="intro-name">TKD ACADEMY</div>
    </div>
    <div class="intro-george-wrap" aria-hidden="true">
      <img class="intro-george" src="intro-george.png" alt="">
    </div>
    <div class="intro-swipe">
      <span>SWIPE TO ENTER</span>
      <b>‹</b>
    </div>
  </section>

  <main class="app-shell">
    <section id="setupScreen" class="screen setup-screen">
      <header class="hero">
        <div class="hero-copy">
          <div class="brand-script">Tobi's</div>
          <div class="brand-main">TAEKWON-DO</div>
          <div class="brand-accent">ACADEMY</div>
          <p>Train. Learn. Progress.</p>
        </div>
        <img class="hero-person" src="tkd-hero.png" alt="Young Taekwon-Do student in a white dobok and red belt performing a side kick">
      </header>
      <section class="setup-card">
        <div class="section-label"><span>1</span> Practice</div>
        <div class="practice-grid" id="practiceTiles">
          <button class="practice-tile active" data-value="common" type="button">
            <span class="tile-icon">한</span><strong>Common Terms</strong><small>Build vocabulary</small>
          </button>
          <button class="practice-tile" data-value="techniques" type="button">
            <span class="tile-icon">🥋</span><strong>Techniques</strong><small>Learn techniques</small>
          </button>
          <button class="practice-tile" data-value="theory" type="button">
            <span class="tile-icon">▤</span><strong>Theory</strong><small>Understand principles</small>
          </button>
        </div>
        <input id="practiceType" type="hidden" value="common">
        <div id="directionSection">
          <div class="section-label"><span>2</span> Direction</div>
          <div class="choice-stack">
            <button class="choice-row active" data-direction="ko2en" type="button">
              <span class="choice-symbol">한</span><span><strong>Korean → English</strong><small>See Korean, recall English</small></span><span class="choice-check">✓</span>
            </button>
            <button class="choice-row" data-direction="en2ko" type="button">
              <span class="choice-symbol">A</span><span><strong>English → Korean</strong><small>See English, recall Korean</small></span><span class="choice-check">○</span>
            </button>
          </div>
          <input id="direction" type="hidden" value="ko2en">
        </div>
        <div class="section-label"><span>3</span> Filters</div>
        <div class="filter-list">
          <label id="beltRow" class="filter-row"><span class="filter-icon">🥋</span><span class="filter-label">Belt</span><select id="belt"></select></label>
          <label id="scopeRow" class="filter-row"><span class="filter-icon">↳</span><span class="filter-label">Belt range</span><select id="scope"><option value="through">Up to selected belt</option><option value="only">Selected belt only</option></select></label>
          <label class="filter-row"><span class="filter-icon">▣</span><span class="filter-label">Category</span><select id="category"><option value="All">All categories</option></select></label>
          <label class="filter-row"><span class="filter-icon">↝</span><span class="filter-label">Mode</span><select id="mode"><option value="smart">Smart Learning</option><option value="random">Random</option><option value="study">Study in order</option><option value="wrong">Wrong only</option></select></label>
        </div>
        <div id="deckSummary" class="deck-summary">Loading cards…</div>
        <button id="resetProgressButton" class="reset-progress" type="button">Reset learning progress</button>
        <button id="startButton" class="start-button" type="button">START PRACTICE <span>→</span></button>
        <div class="version">Tobi's Taekwon-Do Academy · v5.3</div>
      </section>
    </section>

    <section id="practiceScreen" class="screen practice-screen hidden">
      <header class="practice-header">
        <button id="backButton" class="icon-button" type="button" aria-label="Back to settings">←</button>
        <div id="practiceTitle">PRACTICE</div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Settings">⚙</button>
      </header>
      <div class="progress-line"><div id="progressBar"></div></div>
      <div class="progress-count" id="progressCount">0 / 0</div>
      <div id="beltBadge" class="belt-badge hidden"></div>
      <article id="flashcard" class="flashcard" tabindex="0" role="button" aria-label="Flash card. Tap to reveal the answer.">
        <div class="card-inner">
          <div id="frontContent" class="card-face card-front"><div id="question" class="question">Loading…</div><div id="hangul" class="hangul"></div></div>
          <div id="backContent" class="card-face card-back"><div class="answer-label">ANSWER</div><div id="answerWord" class="answer-word"></div><div id="answerDetails" class="answer-details"></div></div>
        </div>
      </article>
      <div class="practice-actions">
        <button id="wrongButton" class="grade-button wrong" type="button">✕ Wrong</button>
        <button id="audioButton" class="audio-button" type="button" aria-label="Play Korean audio">🔊</button>
        <button id="rightButton" class="grade-button right" type="button">✓ Right</button>
      </div>
      <div id="swipeHint" class="swipe-hint">Swipe left for next · tap to reveal</div>
      <div id="stats" class="stats">0 right · 0 wrong</div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="intro-open-sound.js"></script>
</body>
</html>
